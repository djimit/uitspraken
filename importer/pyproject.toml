[project]
name = "rechtspraak-importer"
version = "0.1.0"
description = "Import Dutch court decisions from Rechtspraak Open Data API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "idna>=3.15",
    "lxml>=6.1.0",
    "click>=8.1",
    "tqdm>=4.66",
    "tenacity>=8.2",
]

[tool.setuptools.packages.find]
include = ["rechtspraak*"]

[project.scripts]
rechtspraak = "rechtspraak.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
